home_faq1_q = "What does this Stardew Valley Planner do?"
home_faq1_a = "It provides a farm layout grid, a community center bundle checklist, a gift lookup, and a crop profit calculator — all in one workspace for planning your run."
home_faq2_q = "Does the farm planner know every in-game collision rule?"
home_faq2_a = "No. The grid is a sketch tool. Confirm exact footprints and collision rules in-game before building."
home_faq3_q = "Is the bundle checklist complete?"
home_faq3_a = "It covers the standard 1.6.15 bundles. Mixed variants and platform differences are not included in this first version."
home_faq4_q = "Can I save my Stardew Valley farm layout?"
home_faq4_a = "Yes. Save draft stores your plan name and tile map in your browser. Export JSON gives you a portable backup."
home_faq5_q = "How does the crop calculator work?"
home_faq5_a = "Enter seed cost, sell price, growth days, harvest count, and extra cost. Net profit = (revenue − seed cost − extra cost) / growth days."
home_faq6_q = "Does Valley Ledger belong to Stardew Valley?"
home_faq6_a = "No. This is an unofficial fan resource built from open-source game data. Not affiliated with ConcernedApe."
