home_trust_eyebrow = "Vertrauen und Umfang"
home_trust_title = "Was dieser MVP weiß und was nicht."
home_trust1_h = "Versionierte Referenzdaten"
home_trust1_p = "Die Bündelgruppen, Geschenkbeispiele datierbarer Dorfbewohner und Pflanzen-Presets sind an Stardew-Valley-1.6.15-PC-Referenzen gebunden und am 2026-08-11 verifiziert. Sie bleiben eine fokussierte Teilmenge, kein vollständig automatisch aktualisiertes Wiki."
home_trust2_h = "Quelle vor Umfang"
home_trust2_p = "Jeder interaktive Eintrag trägt einen Quelllink, eine Versionsgrenze und ein Verifikationsdatum. Gemischte Bündel, Plattformunterschiede und Präferenzzustände außerhalb des Umfangs sind bewusst ausgeschlossen."
home_trust3_h = "Standardmäßig lokal"
home_trust3_p = "Planer- und Checklistenstatus werden lokal gespeichert. Kein Speicher-Upload, kein Konto und keine Remote-Farmdaten sind Teil dieses MVP."
home_trust_foot = "Hintergrundreferenzen:"
home_faq_eyebrow = "Fragen"
home_faq_title_1 = "Stardew Valley"
home_faq_title_2 = "Planer-FAQ"
home_faq_note = "Kurze Antworten zum aktuellen Umfang des Tools. Produktionsseiten sollten diese mit versionierten Daten und beispielspezifischen Details erweitern."
home_faq1_q = "Was macht dieser Stardew-Valley-Planer?"
home_faq1_a = "Er bietet ein Farm-Layout-Raster, eine Gemeinschaftszentrum-Bündel-Checkliste, eine Geschenk-Suche und einen Pflanzen-Gewinnrechner — alles in einem Arbeitsbereich für Ihre Planung."
home_faq2_q = "Kennt der Farm-Planer alle In-Game-Kollisionsregeln?"
home_faq2_a = "Nein. Das Raster ist ein Skizzierwerkzeug. Bestätigen Sie genaue Grundrisse und Kollisionsregeln vor dem Bau im Spiel."
home_faq3_q = "Ist die Bündel-Checkliste vollständig?"
home_faq3_a = "Sie deckt die standardmäßigen 1.6.15-Bündel ab. Gemischte Varianten und Plattformunterschiede sind in dieser ersten Version nicht enthalten."
home_faq4_q = "Kann ich mein Farm-Layout speichern?"
home_faq4_a = "Ja. Entwurf speichern sichert Planname und Kachelkarte im Browser. JSON-Export gibt Ihnen eine tragbare Sicherung."
home_faq5_q = "Wie funktioniert der Pflanzenrechner?"
home_faq5_a = "Geben Sie Saatgutkosten, Verkaufspreis, Wachstumstage, Ernteanzahl und Zusatzkosten ein. Nettogewinn = (Einnahmen − Saatgutkosten − Zusatzkosten) / Wachstumstage."
home_faq6_q = "Gehört Valley Ledger zu Stardew Valley?"
home_faq6_a = "Nein. Dies ist eine inoffizielle Fan-Ressource aus Open-Source-Spieldaten, nicht verbunden mit ConcernedApe."
home_latest = "Neueste Updates"

