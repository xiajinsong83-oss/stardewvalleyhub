home_faq1_q = "这个星露谷规划器是做什么的？"
home_faq1_a = "它提供农场布局网格、社区中心收集包清单、礼物查询与作物利润计算器——全部集中在一个工作区里规划你的游玩。"
home_faq2_q = "农场规划器知道所有游戏内碰撞规则吗？"
