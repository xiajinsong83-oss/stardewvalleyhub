home_faq4_q = "我能保存我的星露谷农场布局吗？"
home_faq4_a = "能。保存草稿会把方案名称与方块地图存进浏览器。导出 JSON 给你一份便携备份。"
home_faq5_q = "作物计算器怎么用？"
home_faq5_a = "输入种子成本、售价、生长天数、收获次数与额外成本。净利润 =（收入 − 种子成本 − 额外成本）/ 生长天数。"
home_faq6_q = "Valley Ledger 属于星露谷物语吗？"
home_faq6_a = "不属于。这是基于开源游戏数据的非官方粉丝资源，与 ConcernedApe 无隶属关系。"
