{{ define "main" }}
<div class="content-col">
  {{ partial "breadcrumb.html" . }}
  <div class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
  <div class="farm-maps-grid">
    <div class="farm-map-card">
      <h3>Standard Farm</h3>
      <img src="/images/maps/full-image/Standard Farm Map.png" alt="Standard Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Beach Farm</h3>
      <img src="/images/maps/full-image/Beach Farm Map.png" alt="Beach Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Forest Farm</h3>
      <img src="/images/maps/full-image/Forest Farm Map.png" alt="Forest Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Four Corners Farm</h3>
      <img src="/images/maps/full-image/Four Corners Farm Map.png" alt="Four Corners Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Hilltop Farm</h3>
      <img src="/images/maps/full-image/Hilltop Farm Map.png" alt="Hilltop Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Meadowlands Farm</h3>
      <img src="/images/maps/full-image/Meadowlands Farm Map.png" alt="Meadowlands Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Riverland Farm</h3>
      <img src="/images/maps/full-image/Riverland Farm Map.png" alt="Riverland Farm" loading="lazy">
    </div>
    <div class="farm-map-card">
      <h3>Wilderness Farm</h3>
      <img src="/images/maps/full-image/Wilderness Farm Map.png" alt="Wilderness Farm" loading="lazy">
    </div>
  </div>
</div>
  {{ partial "related-links.html" . }}
{{ end }}
