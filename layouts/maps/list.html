{{ define "main" }}
<div class="content-col">
  {{ partial "breadcrumb.html" . }}
  <div class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
  <div class="farm-map-img">
    <img src="/images/maps/full-image/Standard Farm Map.png" alt="Stardew Valley Standard Farm Map" loading="lazy">
  </div>
</div>
{{ end }}
