<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ .Site.Home.RelPermalink }}"><img src="/favicon.png" alt="" class="logo-icon">Stardew Valley <span>Hub</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a href="/npc/">NPC Gifts</a>
      <a href="/crops/">Crops</a>
      <a href="/fish/">Fish</a>
      <a href="/bundles/">Bundles</a>
      <a href="/tier/crop-profit/">Tier</a>
      <a href="/maps/">Maps</a>
      <a href="/boss/">Bosses</a>
      <a href="/weapons/">Weapons</a>
      <a href="/monsters/">Monsters</a>
      <a href="/faq/">FAQ</a>
      <a href="/updates/">Updates</a>
    </nav>
    {{ partial "lang-switch.html" . }}
  </div>
</header>
<script>
(function(){
  var t = document.getElementById('navToggle'), n = document.getElementById('mainNav');
  if (!t || !n) return;
  t.addEventListener('click', function(){
    var open = n.classList.toggle('open');
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
    t.textContent = open ? '✕' : '☰';
  });
})();
</script>
