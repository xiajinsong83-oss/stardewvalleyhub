{{ define "main" }}
<div class="content-col">
  {{ partial "breadcrumb.html" . }}
  <div class="progress-tracker">
    <div class="pt-title-block">
      <p class="pt-eyebrow">{{ i18n "game_eyebrow" }}</p>
      <h1>{{ .Title }}</h1>
    </div>
    <p class="pt-side">{{ .Params.tagline }}</p>
  </div>

  <div id="gameCanvas" class="game-canvas"></div>
  <div class="game-actions">
    <button class="game-btn" id="gameRestart">{{ i18n "game_restart" }}</button>
  </div>
  <p class="game-hint">{{ i18n "game_fishing_howto" }}</p>
</div>
  {{ partial "ad-inarticle.html" . }}
  {{ partial "related-links.html" . }}
{{ end }}
{{ define "scripts" }}
<script>
window.__gameUI = {
  hold: {{ i18n "game_fishing_hold" | jsonify }},
  win: {{ i18n "game_fishing_win" | jsonify }},
  fail: {{ i18n "game_fishing_fail" | jsonify }},
  restart: {{ i18n "game_restart_hint" | jsonify }}
};
</script>
<script src="/js/vendor/phaser.min.js?v=20261021"></script>
<script src="/js/fishing-game.js?v=20261021" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var b = document.getElementById("gameRestart");
  if (b) b.addEventListener("click", function(){
    if (window.__fishingGame && window.__fishingGame.reset) window.__fishingGame.reset();
  });
});
</script>
{{ end }}
