{{ define "main" }}
<div class="content-col">
  {{ partial "breadcrumb.html" . }}
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="content">{{ .Content }}</div>

  {{ $pages := .Pages.ByTitle }}
  {{ if gt (len $pages) 0 }}
  <div class="card-grid">
    {{ range $pages }}
    <a class="card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
