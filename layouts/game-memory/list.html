{{ define "main" }}
<div class="content-col">
  {{ partial "breadcrumb.html" . }}
  <div class="progress-tracker">
    <div class="pt-title-block">
      <p class="pt-eyebrow">{{ i18n "game_eyebrow" }}</p>
      <h1>{{ .Title }}</h1>
    </div>
    <p class="pt-side">{{ .Params.tagline }}</p>
  </div>

  <div id="gameCanvas" class="game-canvas"></div>
  <div class="game-actions">
    <button class="game-btn" id="gameRestart">{{ i18n "game_restart" }}</button>
  </div>
  <p class="game-hint">{{ i18n "game_memory_howto" }}</p>
</div>
  {{ partial "ad-inarticle.html" . }}
  {{ partial "related-links.html" . }}
{{ end }}
{{ define "scripts" }}
<script>
window.__gameUI = {
  moves: {{ i18n "game_moves" | jsonify }},
  time: {{ i18n "game_time" | jsonify }},
  win: {{ i18n "game_memory_win" | jsonify }}
};
</script>
<script src="/js/vendor/phaser.min.js"></script>
<script src="/js/memory-game.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var b = document.getElementById("gameRestart");
  if (b) b.addEventListener("click", function(){ location.reload(); });
});
</script>
{{ end }}
