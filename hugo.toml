baseURL = "https://stardewvalleyhub.wiki/"
title = "Stardew Valley Hub – Unofficial Fan Guides"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy"]
pygmentsUseClasses = true
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

