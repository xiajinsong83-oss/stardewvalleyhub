baseURL = "https://www.stardewvalleyhub.wiki/"
title = "Stardew Valley Hub – Unofficial Fan Guides"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy"]
pygmentsUseClasses = true
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

# 多语言：默认英语 + 简体中文
[languages.en]
  weight = 1
  languageName = "English"
  contentDir = "content/en"
  title = "Stardew Valley Hub – Unofficial Fan Guides"
[languages.zh-hans]
  weight = 2
  languageName = "简体中文"
  contentDir = "content/zh-hans"
  title = "星露谷物语攻略站（非官方粉丝站）"
[params]
  description = "Data-driven unofficial Stardew Valley guides: NPC gifts, crops, fish, community center bundles, FAQs and update news. Powered by open-source game data."
  email = "39918849@qq.com"
  adsenseClient = "ca-pub-3866829862674413"
  adsenseInArticleSlot = "0000000000"
  adsenseSidebarSlot = "0000000000"
  cookieConsent = true
  githubRepo = "https://github.com/"
  # 数据源（开源结构化数据，非官方）
  dataSource = "https://www.npmjs.com/package/stardew-valley-data"
  dataSourceNote = "All game data on this site comes from machine-readable open-source community data. This is an unofficial fan resource, not affiliated with ConcernedApe."
