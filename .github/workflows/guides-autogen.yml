name: Auto-generate guides
permissions:
  contents: write
on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:  # 支持手动触发
jobs:
  gen-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 3 data-driven original guides
        run: |
          python3 scripts/gen_guides.py --count 3
      - name: Commit and push (with rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD -- content/en/all-guides/ data/.guides-version; then
            echo "No changes in guides, skipping commit."
            exit 0
          fi
          git add content/en/all-guides/ data/.guides-version
          git commit -m "chore: auto-generate 3 data-driven guides ($(date +%F))"
          # 并发冲突防护：pull --rebase 后重试 push（最多 3 次）
          for i in 1 2 3; do
            if git pull --rebase origin main 2>/dev/null && git push origin main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
      # 说明：push 后由 Cloudflare Pages 自动执行 bash build.sh（含 sitemap 生成）。
      # GitHub Actions runner 不装 Hugo，不能在此步构建。
