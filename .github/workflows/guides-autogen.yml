name: Auto-generate guides
permissions:
  contents: write
on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:  # 支持手动触发
jobs:
  gen-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 3 data-driven original guides
        run: |
          python3 scripts/gen_guides.py --count 3
      - name: Commit and push (with rebase + retry)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD -- content/en/all-guides/ data/.guides-version; then
            echo "No changes in guides, skipping commit."
            exit 0
          fi
          git add -A content/en/all-guides/ data/
          # gen_guides.py 可能还会改动其他文件（分类索引/其他数据），全部纳入，避免 rebase 报 unstaged changes
          git add -A
          git commit -m "chore: auto-generate 3 data-driven guides ($(date +%F))"
          # 优先用 PAT（secrets.GH_TOKEN），未配置时回退 GITHUB_TOKEN
          TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            echo "--- attempt $i ---"
            git fetch origin main --quiet || { echo "FETCH FAILED (network / token?)"; sleep 15; continue; }
            # rebase 要求工作区干净：有残留改动先 stash（脚本产物，下次运行会重新生成，丢弃无妨）
            git stash --include-untracked 2>/dev/null || true
            if git rebase origin/main 2>/tmp/rebase.err; then
              # 恢复 stash；若冲突则放弃残留改动
              git stash pop 2>/dev/null || git checkout . 2>/dev/null || true
              if git push "$REMOTE" HEAD:main 2>/tmp/push.err; then
                echo "Push succeeded on attempt $i."
                exit 0
              fi
              echo "PUSH FAILED:"; cat /tmp/push.err
            else
              echo "REBASE FAILED:"; cat /tmp/rebase.err
              git rebase --abort
            fi
            sleep 15
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
      # 说明：push 后由 Cloudflare Pages 自动执行 bash build.sh（含 sitemap 生成）。
      # GitHub Actions runner 不装 Hugo，不能在此步构建。
