name: Auto-update game data
permissions:
  contents: write
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest stardew-valley-data
        run: |
          mkdir -p /tmp/svd
          cd /tmp/svd
          npm init -y
          # 使用淘宝npm镜像加速
          npm config set registry https://registry.npmmirror.com
          npm install stardew-valley-data@latest
      - name: Sync data and images
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OLD_VER=""
          if [ -f data-src/package/package.json ]; then
            OLD_VER=$(cat data-src/package/package.json | grep version | head -1 | cut -d'"' -f4)
          fi
          rm -rf data-src/package
          cp -r /tmp/svd/node_modules/stardew-valley-data data-src/package
          mkdir -p data
          cp data-src/package/data/fish.json data/fish.json
          cp data-src/package/data/artifacts.json data/artifacts.json
          cp data-src/package/data/minerals.json data/minerals.json
          NEW_VER=$(cat data-src/package/package.json | grep version | head -1 | cut -d'"' -f4)
          echo "OLD_VER=$OLD_VER" >> $GITHUB_ENV
          echo "NEW_VER=$NEW_VER" >> $GITHUB_ENV
          echo "Old Version: $OLD_VER"
          echo "New Version: $NEW_VER"
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- data-src/ data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in data, skipping."
          else
            if [ -z "${{ env.OLD_VER }}" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "No previous version, import new data ${{ env.NEW_VER }}"
            elif [ "$(printf '%s\n' "${{ env.OLD_VER }}" "${{ env.NEW_VER }}" | sort -V | head -n1)" != "${{ env.NEW_VER }}" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Data updated from ${{ env.OLD_VER }} to ${{ env.NEW_VER }}"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⚠️ New version ${{ env.NEW_VER }} older than current ${{ env.OLD_VER }}, skip downgrade"
            fi
          fi
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-src/ data/
          git commit -m "chore: auto-update game data ${{ env.OLD_VER }} → ${{ env.NEW_VER }}"
          git push origin main
